[project]
name = "somna-mcp-hub"
version = "0.1.0"
description = "Somna AI — MCP Hub (FastAPI tool server for Agent Core)"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.9",

    # Config / logging
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "python-json-logger>=2.0",

    # Filesystem / paths
    "aiofiles>=24.1",
    "anyio>=4.4",
    "tenacity>=9.0",

    # Search providers (optional, loaded lazily)
    # "tavily-python>=0.5",   # enable when key is available
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
