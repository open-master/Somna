[project]
name = "somna-agent-core"
version = "0.1.0"
description = "Somna AI — Agent Core (FastAPI + LangGraph + Claude SDK + mem0)"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",

    # Config / logging
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "python-json-logger>=2.0",

    # LangGraph / LangChain
    "langgraph>=0.2.40",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",

    # LLM clients
    "openai>=1.51",
    "anthropic>=0.34",
    "claude-agent-sdk>=0.1.48",

    # Storage / DB
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "redis[hiredis]>=5.1",
    "aioboto3>=13.0",
    "sqlalchemy[asyncio]>=2.0",

    # Event bus
    "nats-py>=2.9",
    "temporalio>=1.8",

    # Memory
    "mem0ai>=0.1.50",
    "pymilvus>=2.4",

    # Tools / observability
    "tenacity>=9.0",
    "langfuse>=2.50",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-instrumentation-fastapi>=0.47b0",

    # Local Somna packages (editable installs via Docker COPY)
    "somna-events",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]

[tool.uv.sources]
somna-events = { path = "../../packages/event-schema/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
