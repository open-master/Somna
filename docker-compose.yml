name: somna

# ============================================================
#  Somna AI — Docker Compose (开发/单机部署)
#  所有服务共用根目录 .env
# ============================================================

x-common-env: &common-env
  env_file:
    - .env

networks:
  default:
    name: somna_net
    driver: bridge
  sandbox_net:
    name: somna_sandbox_net
    driver: bridge

volumes:
  pg_data:
  mysql_data:
  redis_data:
  minio_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  temporal_data:
  langfuse_pg:
  nats_data:
  sandboxes_data:

services:
  # ==================== Postgres (Agent 状态 + pgvector + LiteLLM 日志) ====================
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== MySQL (业务库) ====================
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 宿主机端口：云主机常已占用 3306，可在 .env 设 MYSQL_HOST_PORT=3307
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Redis ====================
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== MinIO (S3 兼容对象存储) ====================
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc mb --ignore-existing local/langfuse;
      mc anonymous set download local/$$S3_BUCKET;
      echo 'buckets ready';
      "
    restart: "no"

  # ==================== Milvus (向量库) ====================
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.14
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_SECRET_KEY}
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9011"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.13
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      # 须与 milvus-minio 的 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 一致
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY}
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_started
      milvus-minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== NATS JetStream (事件总线) ====================
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== Temporal ====================
  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - temporal_data:/etc/temporal
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.32.0
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:8233
    depends_on:
      - temporal
    ports:
      - "8233:8080"

  # ==================== Langfuse (Agent trace 观测) ====================
  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/public/health"]
      interval: 20s
      timeout: 5s
      retries: 10

  # ==================== LiteLLM Proxy ====================
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: ${LITELLM_DATABASE_URL}
      STORE_MODEL_IN_DB: "True"
      # 避免每次启动跑 prisma migrate + diff 导致长时间无监听（agent-core 连不上网关）。
      # 全新库首次部署：可先注释本行，待 litellm healthy 后再恢复为 True。
      DISABLE_SCHEMA_UPDATE: "True"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ==================== MCP Hub (工具服务) ====================
  mcp-hub:
    build:
      context: .
      dockerfile: apps/mcp-hub/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # httpx 会读取 HTTP_PROXY/HTTPS_PROXY。Brave/DDG 在容器里连不上时，在 .env 中设置
    # HTTPS_PROXY=http://host.docker.internal:7890 后: docker compose up -d --force-recreate mcp-hub
    environment:
      SANDBOX_ROOT: /var/somna/sandboxes
    volumes:
      - ./apps/mcp-hub/app:/app/app:ro
      - sandboxes_data:/var/somna/sandboxes
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/healthz"]
      interval: 20s
      timeout: 5s
      retries: 10

  # ==================== Agent Core (FastAPI + LangGraph) ====================
  # Python 依赖（含 claude-agent-sdk）在镜像构建时安装（见 apps/agent-core/Dockerfile）。
  # 更新 pyproject 后请重新构建：docker compose build agent-core
  # 或启动时顺带构建：docker compose up -d --build agent-core
  agent-core:
    build:
      context: .
      dockerfile: apps/agent-core/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
      temporal: { condition: service_healthy }
      litellm:  { condition: service_healthy }
      mcp-hub:  { condition: service_healthy }
    ports:
      - "8000:8000"
    volumes:
      - ./apps/agent-core/app:/app/app:ro
      - ./packages/prompts:/packages/prompts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 10

  # ==================== Web 前端 (Next.js 14) ====================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        AGENT_CORE_URL: http://agent-core:8000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 前端在 Docker 网络内通过服务名访问后端
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
      AGENT_CORE_URL: http://agent-core:8000
    depends_on:
      agent-core:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 10

