services:
  # Avoid host-port conflicts on dev machines. Services inside the docker
  # network still reach each other via internal DNS names.
  redis:
    ports: !override []
  litellm:
    ports: !override []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
